[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-orizn"
version = "0.1.1"
description = "LangChain tools for Orizn Visa API — 39,585 passport-destination pairs in 15 languages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Orizn", email = "api@orizn.app" }]
keywords = ["langchain", "visa", "travel", "passport", "ai-agent", "tool"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langchain-core>=0.2.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://visa.orizn.app"
Repository = "https://github.com/MattJeff/langchain-orizn"
Documentation = "https://visa.orizn.app/visa-api/dashboard/docs"
